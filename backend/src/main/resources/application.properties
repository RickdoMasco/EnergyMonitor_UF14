spring.application.name=energy-monitor-backend

# Supporta i file di configurazione per ambiente:
# - config/dev.env per lo sviluppo locale
# - config/test.env per l'ambiente di test
# - fallback legacy: .env nella root del repository
spring.config.import=optional:file:./config/${SPRING_PROFILES_ACTIVE:dev}.env[.properties],optional:file:../config/${SPRING_PROFILES_ACTIVE:dev}.env[.properties],optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
