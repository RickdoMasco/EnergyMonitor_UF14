services:
  postgres:
    build: ./docker/postgres
    container_name: energymonitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB non impostata nel file .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER non impostata nel file .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD non impostata nel file .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
