apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: energymonitor-ingress
  labels:
    app: energymonitor-backend
spec:
  ingressClassName: nginx
  rules:
    - host: energymonitor.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: energymonitor-backend
                port:
                  number: 8080
