apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: energymonitor-ingress
  namespace: default
  labels:
    app: energymonitor
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: energymonitor-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: energymonitor-frontend
                port:
                  number: 80
