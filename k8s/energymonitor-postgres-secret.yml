apiVersion: v1
kind: Secret
metadata:
  name: energymonitor-postgres-secret
  namespace: default
stringData:
  POSTGRES_DB: energymonitor
  POSTGRES_USER: energymonitor
  POSTGRES_PASSWORD: cambiami
  POSTGRES_HOST: host.docker.internal
  POSTGRES_PORT: "5432"

# Poiché il database PostgreSQL gira fuori dal cluster Kubernetes 
# (direttamente su Windows o in un container Docker separato sulla porta 5432), 
# il pod del backend non può usare localhost per trovarlo.
# Scrivendo host.docker.internal, Docker Desktop traduce automaticamente quel nome nell'indirizzo IP interno del tuo PC Windows, 
# creando un ponte verso la porta 5432 del database.