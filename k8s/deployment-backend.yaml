apiVersion: apps/v1
kind: Deployment
metadata:
  name: energymonitor-backend
  labels:
    app: energymonitor-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: energymonitor-backend
  template:
    metadata:
      labels:
        app: energymonitor-backend
    spec:
      containers:
        - name: backend
          image: localhost:32000/energymonitor-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: energymonitor-backend-config
            - secretRef:
                name: energymonitor-backend-secret
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
