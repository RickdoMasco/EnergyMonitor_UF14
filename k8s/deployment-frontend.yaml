apiVersion: apps/v1
kind: Deployment
metadata:
  name: energymonitor-frontend
  labels:
    app: energymonitor-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: energymonitor-frontend
  template:
    metadata:
      labels:
        app: energymonitor-frontend
    spec:
      containers:
        - name: frontend
          image: energymonitor-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
