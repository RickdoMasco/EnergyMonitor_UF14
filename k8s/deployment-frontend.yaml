apiVersion: apps/v1
kind: Deployment
metadata:
  name: energymonitor-frontend
  namespace: default
  labels:
    app: energymonitor-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: energymonitor-frontend
  template:
    metadata:
      labels:
        app: energymonitor-frontend
    spec:
      containers:
        - name: frontend
          image: energymonitor-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
