<div class="min-h-screen flex flex-col items-center justify-center  p-6 text-center gap-10">
    <h1 class="text-2xl font-extrabold">Aggiungi un nuovo utente</h1>

    <form [formGroup]="formUser" (ngSubmit)="submit()" class="flex flex-col gap-4">
        <div class="flex flex-col gap-2">
            <label for="nome">Nome</label>
            <input id="nome" pInputText formControlName="nome" />
            <small class="text-red-500" *ngIf="formUser.get('nome')?.invalid && formUser.get('nome')?.touched">Nome is required</small>
        </div>
        <div class="flex flex-col gap-2">
            <label for="Cognome">Cognome</label>
            <input id="Cognome" pInputText formControlName="cognome" />
            <small class="text-red-500" *ngIf="formUser.get('cognome')?.invalid && formUser.get('cognome')?.touched">Cognome is required</small>
        </div>
        <div class="flex flex-col gap-2">
            <label for="email">email</label>
            <input id="email" pInputText formControlName="email" />
            <small class="text-red-500" *ngIf="formUser.get('email')?.invalid && formUser.get('email')?.touched">Email is required</small>
        </div>
        <div class="flex flex-col gap-2">
            <label for="password">Password</label>
            <input id="password" pInputText formControlName="password" />
            <small class="text-red-500" *ngIf="formUser.get('password')?.invalid && formUser.get('password')?.touched">Password is required</small>
        </div>

        <div class="flex flex-col gap-2">
            <label for="role">Ruolo assegnato:</label>
            <p-select [options]="Roles" formControlName="role" optionLabel="name" optionValue="name" placeholder="Seleziona un ruolo" styleClass="w-40" />
        </div>

        <div class="flex justify-end gap-2">
            <button pButton type="submit" label="Submit">Invia</button>
        </div>
    </form>

</div>
